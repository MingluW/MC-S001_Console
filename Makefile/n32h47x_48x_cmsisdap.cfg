# ============================================================
# OpenOCD config for n32h47x_48x with CMSIS-DAP
#
# Flash algorithm loaded from flash_op.bin into SRAM,
# then called via BKPT-based function calls.
#
# Usage:
#   Download: openocd -c "set CMSISDAP_RESET_TYPE 1" -f xxxx_cmsisdap.cfg -c "init" -c "reset halt" -c "flash_program_bin <file.bin>" -c "reset run" -c "shutdown"
#   Debug:    openocd -c "set CMSISDAP_RESET_TYPE 1" -f xxxx_cmsisdap.cfg
#   Erase:    openocd -c "set CMSISDAP_RESET_TYPE 1" -f xxxx_cmsisdap.cfg -c "init" -c "reset init" -c "flash_mass_erase" -c "reset run" -c "shutdown"
#
# ============================================================

# --- CMSIS-DAP Interface ---
adapter driver cmsis-dap

# CMSIS-DAP-NSLink (Nation Tech): VID=0x19F5 PID=0x3106
# Standard CMSIS-DAP: VID=0xC251 PID=0xF001
# DAPLink:           VID=0x0D28 PID=0x0204
set ADAPTER_VID 0x19F5
set ADAPTER_PID 0x3106
if {[catch {adapter usb vid_pid $::ADAPTER_VID $::ADAPTER_PID}]} {
    cmsis_dap_vid_pid $::ADAPTER_VID $::ADAPTER_PID
}

transport select swd

# Source mem_helper.tcl for mrw/mww/mdw commands
source [find mem_helper.tcl]



adapter speed 1000
## NTFx CODE START ##

# --- Target: N32H473CCL7 (Cortex-M4) ---
set _CHIPNAME n32h47x_48x

# ============================================================
# Flash geometry from FlashDev.c
#   Flash start:  0x8000000
#   Flash size:  0x80000
#   Sector size: 0x2000 
# ============================================================
set FLASH_START 0x8000000   
set FLASH_SIZE  0x80000
set FLASH_PAGE  0x2000  

# ============================================================
# FlashOS SRAM Algorithm 
#
# Loaded into system memory at 0x20000000.
#
# Function addresses:
#   Init        0x20000001
#   UnInit      0x20000047
#   EraseChip   0x20000059
#   EraseSector 0x20000097
#   ProgramPage 0x200000D9
#   Verify      0x20000167
# ============================================================
set FLASH_ALGO_BIN    "flash_op/n32h47x_48x_flash_op.bin"
set FLASH_ALGO_BASE   0x20000000

set FOS_Init          0x20000001
set FOS_UnInit        0x20000047
set FOS_EraseChip     0x20000059
set FOS_EraseSector   0x20000097
set FOS_ProgramPage   0x200000D9
set FOS_Verify       0x20000167

# SRAM working area layout:
#     0x20000000- 0x200001A0 : flash_op algorithm
#     0x200001A1 - 0x20000FDF : unused margin
#     0x20000FE0             : temp stack top (grows downward)
#     0x20000FF0             : BKPT instruction for function return
#     0x20001000 - 0x20005000 : image data buffer (up to FOS_BUF_SIZE per run)
set FOS_BUF_ADDR      0x20001000
set FOS_BUF_SIZE      0x4000  
set FOS_STACK_TOP     0x20000FE0
set FOS_BKPT_ADDR     0x20000FF0

## NTFx CODE END ##
set _ENDIAN little

# Standard Cortex-M4 IDCODE: 0x2BA01477. Remove -expected-id if chip uses different ID
swd newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x2BA01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

# --- Reset config ---
#   0 = SYSRESETREQ  Software system reset. Resets the whole chip except the
#                    debug logic. This is what you want on a board that has
#                    no nRST wired to the debugger.
#   1 = HW RESET         Hardware nRST. There is no fallback to a software reset
#                    if the line is not wired: the chip simply is not reset.
#                    The core is pre-halted so that a download still works
#                    (see the CMSISDAP_RESET_TYPE=1 branch below).
#   2 = VECTRESET    Core-only reset. Does NOT reset peripherals, clocks or
#                    the flash controller, so the chip keeps whatever state
#                    the application left behind.
if {![info exists CMSISDAP_RESET_TYPE]} {
    set CMSISDAP_RESET_TYPE 0
}

# Only one of HW RESET / {SYSRESETREQ, VECTRESET} can be in effect: declaring a
# signal keyword in reset_config is what puts the Cortex-M driver on the
# hardware-reset path, and 'cortex_m reset_config' is consulted only when no
# HW RESET was declared.
switch -exact -- $CMSISDAP_RESET_TYPE {
    0 {
        reset_config srst_nogate
        if {![using_hla]} {
            cortex_m reset_config sysresetreq
        }
    }
    1 {
        reset_config srst_only

        # Pre-halt the core before every reset.
        $_TARGETNAME configure -event reset-assert-pre {
            if {[catch {halt} msg]} {
                puts "  pre-reset halt failed: $msg"
            }
        }
    }
    2 {
        reset_config srst_nogate
        if {![using_hla]} {
            cortex_m reset_config vectreset
        }
    }
    default {
        puts "CMSISDAP_RESET_TYPE must be 0 (SYSRESETREQ), 1 (HW RESET) or 2 (VECTRESET), got '$CMSISDAP_RESET_TYPE'"
        error "CMSISDAP_RESET_TYPE must be 0 (SYSRESETREQ), 1 (HW RESET) or 2 (VECTRESET), got '$CMSISDAP_RESET_TYPE'"
    }
}

$_TARGETNAME configure -event gdb-attach {
    halt 1000
}
$_TARGETNAME configure -event gdb-detach {
    resume
}

# ============================================================
# Guarded load_image
# ============================================================
proc _safe_load_image {file addr} {
    if {[catch {load_image $file $addr} msg]} {
        puts "  load_image Fail: $msg"
        puts "  Please disconnect and reconnect the debugger, then try again,"
        error $msg
    }
}


# ============================================================
# Load flash algorithm binary to system memory
# ============================================================
proc flashos_load {} {
    if {![file exists $::FLASH_ALGO_BIN]} {
        error "Flash algorithm binary not found: $::FLASH_ALGO_BIN"
    }
    puts "Loading $::FLASH_ALGO_BIN to [format 0x%08X $::FLASH_ALGO_BASE]..."
    _safe_load_image $::FLASH_ALGO_BIN $::FLASH_ALGO_BASE

    # Verify: read back first word to confirm binary is in memory
    set first_word [mrw $::FLASH_ALGO_BASE]
    puts "Algorithm @ [format 0x%08X $::FLASH_ALGO_BASE]: [format 0x%08X $first_word]"
    if {$first_word == 0 || $first_word == 0xFFFFFFFF} {
        error "Flash algorithm not loaded correctly: first word = [format 0x%08X $first_word]"
    }
}

# ============================================================
# Register-name compatibility shim.
#
# OpenOCD >= 0.12 normalizes ARM register names to lowercase
# ("xpsr"); older versions use the ARM mixed-case name ("xPSR").
# The config script has no direct version query, so probe the
# target once (must be halted) and cache the result. The probe
# runs on the first flashos_call, after "reset halt".
# ============================================================
set ::XPSR_REG ""
proc _xpsr_regname {} {
    if {$::XPSR_REG eq ""} {
        if {![catch {reg xPSR}]} {
            set ::XPSR_REG xPSR
        } else {
            set ::XPSR_REG xpsr
        }
    }
    return $::XPSR_REG
}

# ============================================================
# Call a FlashOS function in SRAM
#
# Mechanism:
#   1. (full_setup only) Write BKPT (0xBE00) at FOS_BKPT_ADDR
#   2. Set SP = FOS_STACK_TOP (isolated temp stack)
#   3. Set args in R0-R3
#   4. (full_setup only) Set LR = FOS_BKPT_ADDR | 1 (Thumb return addr)
#   5. Set PC = func_addr, resume
#   6. Function executes BX LR -> hits BKPT -> core halts
#   7. Read R0 for return value
#
# All flash functions return: 0 = OK, 1 = Failed
# ============================================================
proc flashos_call {full_setup func_addr args} {
    # Place BKPT instruction (0xBE00) at return address
    if {$full_setup} {
        mww $::FOS_BKPT_ADDR 0x0000BE00
    }

    # Set isolated stack for the function
    reg sp $::FOS_STACK_TOP

    # Set up arguments in R0-R3 (ARM EABI: first 4 args in registers)
    set regs {r0 r1 r2 r3}
    set i 0
    foreach val $args {
        reg [lindex $regs $i] $val
        incr i
        if {$i >= 4} { break }
    }
    if {$full_setup} {
        # Zero remaining arg registers
        for {} {$i < 4} {incr i} {
            reg [lindex $regs $i] 0
        }

        # LR = return address with Thumb bit set
        reg lr [expr {$::FOS_BKPT_ADDR | 1}]

        # Force Thumb state: "reset halt" leaves the core mid-reset with
        # xPSR.T=0, and without T=1 the first fetch faults (INVSTATE) before
        # the function runs. Register name differs by OpenOCD version:
        # >= 0.12 uses lowercase "xpsr", older versions use "xPSR" —
        # _xpsr_regname resolves it at runtime.
        reg [_xpsr_regname] 0x01000000
    }

    # Jump to function and run
    reg pc $func_addr

    resume

    # Wait for BKPT hit (function return)
    # Timeout generous enough for flash erase operations
    wait_halt 15000

    set ret_raw [reg r0]
    set ret 0
    if {![regexp {(0x[0-9a-fA-F]+)} $ret_raw -> ret_hex]} {
        set ret_hex $ret_raw
    }
    set ret [expr {$ret_hex}]
    return $ret
}

# ============================================================
# Flash Operations — wrap FlashOS SRAM functions
# ============================================================

proc flashos_init {} {
    set ret [flashos_call 1 $::FOS_Init 0x08000000 0 1]
    if {$ret != 0} {
        puts "FlashOS Init failed with return code $ret"
        error "FlashOS Init returned $ret"
    }
    puts "FlashOS Init OK."
}

proc flashos_uninit {} {
    flashos_call 1 $::FOS_UnInit 0
    puts "FlashOS UnInit OK."
}

proc flashos_erase_sector {addr} {
    set ret [flashos_call 0 $::FOS_EraseSector $addr]
    if {$ret != 0} {
        puts "FlashOS EraseSector @ [format 0x%08X $addr] failed with return code $ret"
        error "FlashOS EraseSector failed"
    }
}

# ============================================================
# Mass erase via FlashOS EraseChip
# ============================================================
proc flash_mass_erase {} {
    set ret [flashos_call 0 $::FOS_EraseChip]
    if {$ret != 0} {
        puts "FlashOS EraseChip failed with return code $ret"
        error "FlashOS EraseChip returned $ret"
    }
    puts "Mass erase complete."
}

# ============================================================
# Flash init (triggered by reset-init)
# Loads the SRAM algorithm and calls FlashOS Init
# ============================================================
$_TARGETNAME configure -event reset-init {
    flashos_load
    flashos_init
}

# ============================================================
# Write chunk from TCL string data to SRAM via temp file + _safe_load_image
# Much faster than word-by-word mww loop (uses bulk debug transfer)
# ============================================================
proc _sram_load_chunk {bin_file offset size dst_addr} {
    set tmp "_chunk_tmp.bin"
    set src [open $bin_file rb]
    fconfigure $src -translation binary
    seek $src $offset start
    set chunk [read $src $size]
    close $src

    set fh [open $tmp wb]
    fconfigure $fh -translation binary
    puts -nonewline $fh $chunk
    close $fh

    if {[file size $tmp] != $size} {
        file delete $tmp
        error "Short binary chunk: $bin_file offset=$offset expected=$size"
    }
    _safe_load_image $tmp $dst_addr
    file delete $tmp
}

# ============================================================
# Main flash programming procedure  (chunked, FOS_BUF_SIZE per run)
#
# Flow:
#   1. Load flash_op.bin to system memory (0x20000000)
#   2. Call FlashOS Init
#   3. Erase all affected sectors
#   4. Program sector by sector (copy data to SRAM buffer, call ProgramPage)
#   5. Call FlashOS UnInit (lock flash)
#
# All flash operations execute on the target CPU from SRAM,
# not via debugger memory writes.
# ============================================================
proc flash_program_bin {bin_file {start_addr 0x8000000}} {
    set _t0 [clock milliseconds]
    set page_size $::FLASH_PAGE
    set chunk_size $::FOS_BUF_SIZE
    puts "=========================================="
    puts "File: $bin_file"
    

    if {![file exists $bin_file]} {
        error "File not found: $bin_file"
    }
    if {[expr {$start_addr & ($page_size - 1)}] != 0} {
        puts "start_addr must be $page_size-byte aligned, got [format 0x%08X $start_addr]"
        return 
    }
    set len [file size $bin_file]
    if {$len == 0} {
        puts "File is empty: $bin_file"
        return
    }

    puts "Binary size: $len bytes"
    puts "Start address: [format 0x%08X $start_addr]"
    puts "Sector size: [format 0x%X $::FLASH_PAGE]"
    puts "=========================================="

    set end_addr [expr {$start_addr + $len}]
    if {$end_addr > [expr {$::FLASH_START + $::FLASH_SIZE}]} {
        puts "Binary too large: $len bytes (flash max $::FLASH_SIZE)"
        return
    }

    # Load and initialize the flash algorithm
    flashos_load
    flashos_init

    set page_size $::FLASH_PAGE

    # ---- Phase 1: Erase all affected sectors ----
    puts "Erasing all affected sectors..."
    set sector_count 0
    for {set pa $start_addr} {$pa < $end_addr} {set pa [expr {$pa + $page_size}]} {
        puts "  Erasing sector @ [format 0x%08X $pa]"
        flashos_erase_sector $pa
        incr sector_count
    }
    puts "[expr {$sector_count}] sector(s) erased."

    # ---- Phase 2: Program + Verify (one call per FOS_BUF_SIZE chunk)  ----
    # Verify runs right after each ProgramPage, while the SRAM buffer still
    # holds the chunk — no second SWD reload of the same data.
    puts "Programming and Verify..."
    for {set pa $start_addr} {$pa < $end_addr} {set pa [expr {$pa + $chunk_size}]} {
        # Calculate data range for this sector
        set chunk_start [expr {$pa > $start_addr ? $pa : $start_addr}]
        set next_pa [expr {$pa + $chunk_size}]
        set chunk_end [expr {$next_pa < $end_addr ? $next_pa : $end_addr}]
        set chunk_sz [expr {$chunk_end - $chunk_start}]

        if {$chunk_sz <= 0} { continue }

        set src_offset [expr {$chunk_start - $start_addr}]
        _sram_load_chunk $bin_file $src_offset $chunk_sz $::FOS_BUF_ADDR

        # Program via FlashOS
        set ret [flashos_call 0 $::FOS_ProgramPage $chunk_start $chunk_sz $::FOS_BUF_ADDR]
        if {$ret != 0} {
            puts "ProgramPage @ [format 0x%08X $chunk_start] returned $ret"
            error "ProgramPage failed"
            return
        }

        # Verify immediately while the buffer still holds the chunk
        # (no second SWD reload of the same data)
        set ret [flashos_call 0 $::FOS_Verify $chunk_start $chunk_sz $::FOS_BUF_ADDR]
        if {$ret != 0} {
            puts "Verify failed @ [format 0x%08X $chunk_start] (returned $ret)"
            error "Verify failed"
            return
        }

        # Progress
        set progress [expr {($chunk_end - $start_addr) * 100 / $len}]
        puts "  $progress% (program+verify @ [format 0x%08X $chunk_start])"
    }

    # Lock flash
    flashos_uninit

    set _el [expr {[clock milliseconds] - $_t0}]
    puts "Flash programming complete in [format %.1f [expr {$_el / 1000.0}]] s."
}
